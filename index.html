<!DOCTYPE html>
<html lang="en" data-court="winter">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOONBOUND_7 — The Manor</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --snow: #F8F9FC;
      --pure-white: #FFFFFF;
      --midnight: #11121A;
      --silver: #C6CBD5;
      --silver-bright: #EEF1F7;
      --plum: #54264F;
      --royal-purple: #5428A8;
      --royal-blue: #263F9B;
      --sky-blue: #91C9EE;
      --burgundy: #701D3C;
      --wine: #481629;
      --moonlight: #E5EAF4;
      --hunter-green: #183D2D;
      --evergreen-deep: #0E241B;
      --sunset-lavender: #8E7CC3;
      --dusky-rose: #C27BA0;
      --lantern-warm: #FFF6E0;

      --bg-primary: var(--midnight);
      --bg-elevated: rgba(20, 22, 36, 0.86);
      --bg-scene:
        radial-gradient(circle at 50% 12%, rgba(194, 123, 160, 0.25) 0%, rgba(142, 124, 195, 0.18) 30%, transparent 65%),
        radial-gradient(circle at 80% 18%, rgba(145, 201, 238, 0.2) 0%, transparent 45%),
        linear-gradient(180deg, #1b1830 0%, var(--midnight) 58%, #101c18 100%);
      --accent-glow: rgba(145, 201, 238, 0.35);
      --border-metallic: var(--silver);
    }

    [data-court="autumn"] {
      --bg-primary: #14090E;
      --bg-elevated: rgba(42, 16, 29, 0.88);
      --bg-scene:
        radial-gradient(circle at 50% 12%, rgba(194, 123, 160, 0.28) 0%, transparent 60%),
        linear-gradient(180deg, #2b1024 0%, var(--wine) 55%, var(--burgundy) 100%);
      --accent-glow: rgba(198, 203, 213, 0.25);
      --border-metallic: #A8AEB9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      background-image: var(--bg-scene);
      color: var(--snow);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.6s ease;
    }

    .particles-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--pure-white), var(--sky-blue));
      opacity: 0.55;
      animation: floatDrift linear infinite;
    }

    @keyframes floatDrift {
      0% { transform: translateY(105vh) translateX(0); opacity: 0; }
      20% { opacity: 0.65; }
      80% { opacity: 0.45; }
      100% { transform: translateY(-10vh) translateX(25px); opacity: 0; }
    }

    /* Entrance Silver Gates */
    #entrance-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 0.8s ease 0.7s, visibility 0.8s ease 0.7s;
    }

    #entrance-overlay.gates-open {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate-wing {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      background:
        linear-gradient(180deg, rgba(142, 124, 195, 0.32) 0%, rgba(194, 123, 160, 0.24) 35%, rgba(24, 61, 45, 0.45) 75%, rgba(17, 18, 26, 0.96) 100%),
        repeating-linear-gradient(90deg, rgba(238, 241, 247, 0.09) 0px, rgba(238, 241, 247, 0.09) 2px, transparent 2px, transparent 42px),
        #151624;
      backdrop-filter: blur(10px);
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gate-left { left: 0; border-right: 2px solid var(--silver-bright); }
    .gate-right { right: 0; border-left: 2px solid var(--silver-bright); }
    #entrance-overlay.gates-open .gate-left { transform: translateX(-100%); }
    #entrance-overlay.gates-open .gate-right { transform: translateX(100%); }

    .entrance-card {
      position: relative;
      z-index: 2;
      max-width: 540px;
      margin: 1.25rem;
      padding: 2.25rem 1.75rem;
      text-align: center;
      background: rgba(17, 18, 26, 0.78);
      border: 1.5px solid var(--silver-bright);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 50px rgba(194, 123, 160, 0.3);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    #entrance-overlay.gates-open .entrance-card { opacity: 0; transform: scale(0.95); }

    .lantern-glow {
      font-size: 0.82rem;
      letter-spacing: 2px;
      color: var(--lantern-warm);
      text-shadow: 0 0 12px rgba(255, 246, 224, 0.85);
      margin-bottom: 0.65rem;
    }

    .entrance-crest {
      font-family: 'Cinzel Decorative', serif;
      font-size: 2.15rem;
      color: var(--pure-white);
      text-shadow: 0 0 22px var(--sky-blue), 0 0 38px var(--sunset-lavender);
      letter-spacing: 3px;
    }

    .entrance-desc {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.18rem;
      line-height: 1.55;
      color: var(--moonlight);
      margin: 0.9rem 0 1.65rem;
    }

    .enter-manor-btn {
      padding: 0.95rem 2.3rem;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--midnight);
      background: linear-gradient(135deg, var(--pure-white) 0%, var(--moonlight) 50%, var(--silver) 100%);
      border: 2px solid var(--pure-white);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 28px rgba(255, 246, 224, 0.45);
      transition: transform 0.25s ease;
    }

    .enter-manor-btn:hover { transform: scale(1.05); }

    /* Top Bar + Docked "Keep Playing" Mini-Player */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(17, 18, 26, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(198, 203, 213, 0.35);
      padding: 0.65rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: var(--moonlight);
    }

    .moonstone-orb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #d9ecff 50%, #91C9EE 90%);
      box-shadow: 0 0 10px var(--sky-blue);
      flex-shrink: 0;
    }

    .docked-player {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background: rgba(84, 40, 168, 0.28);
      border: 1px solid var(--sky-blue);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      color: var(--pure-white);
    }

    .docked-player.visible { display: flex; }

    .docked-title {
      max-width: 210px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .silver-pill-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-metallic);
      color: var(--snow);
      padding: 0.32rem 0.75rem;
      border-radius: 999px;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .silver-pill-btn:hover { background: var(--silver-bright); color: var(--midnight); }

    /* Main Container */
    .estate-container {
      position: relative;
      z-index: 2;
      max-width: 1020px;
      margin: 0 auto;
      padding: 2rem 1.25rem 5rem;
    }

    .estate-banner {
      text-align: center;
      padding: 2rem 1.5rem;
      margin-bottom: 1.75rem;
      background: linear-gradient(135deg, rgba(142, 124, 195, 0.16), rgba(17, 18, 26, 0.86) 50%, rgba(194, 123, 160, 0.14));
      border: 1.5px solid var(--border-metallic);
      border-radius: 22px;
      position: relative;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    }

    .diamond-spark {
      position: absolute;
      width: 9px;
      height: 9px;
      background: var(--pure-white);
      transform: rotate(45deg);
      box-shadow: 0 0 12px var(--sky-blue);
    }
    .diamond-spark.tl { top: -5px; left: -5px; }
    .diamond-spark.tr { top: -5px; right: -5px; }
    .diamond-spark.bl { bottom: -5px; left: -5px; }
    .diamond-spark.br { bottom: -5px; right: -5px; }

    .crown-sigil {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 4px;
      color: var(--sky-blue);
      margin-bottom: 0.35rem;
    }

    .manor-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.65rem, 4vw, 2.5rem);
      background: linear-gradient(180deg, var(--pure-white) 0%, var(--moonlight) 55%, var(--silver) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .manor-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: var(--silver);
      margin-top: 0.45rem;
    }

    /* Navigation */
    .room-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.55rem;
      margin-bottom: 2.25rem;
    }

    .room-btn {
      background: var(--bg-elevated);
      border: 1px solid rgba(198, 203, 213, 0.42);
      color: var(--moonlight);
      padding: 0.58rem 1.05rem;
      border-radius: 999px;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .room-btn::after { content: "🐾"; font-size: 0.68rem; margin-left: 0.4rem; opacity: 0.35; }
    .room-btn:hover, .room-btn.active {
