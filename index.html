<!DOCTYPE html>
<html lang="en" data-court="winter">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOONBOUND_7 — The Manor</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --snow: #F8F9FC;
      --pure-white: #FFFFFF;
      --midnight: #11121A;
      --silver: #C6CBD5;
      --silver-bright: #EEF1F7;
      --plum: #54264F;
      --royal-purple: #5428A8;
      --royal-blue: #263F9B;
      --sky-blue: #91C9EE;
      --burgundy: #701D3C;
      --wine: #481629;
      --moonlight: #E5EAF4;
      --hunter-green: #183D2D;
      --evergreen-deep: #0E241B;
      --sunset-lavender: #8E7CC3;
      --dusky-rose: #C27BA0;
      --lantern-warm: #FFF6E0;

      --bg-primary: var(--midnight);
      --bg-elevated: rgba(20, 22, 36, 0.88);
      --bg-scene:
        radial-gradient(circle at 50% 12%, rgba(194, 123, 160, 0.25) 0%, rgba(142, 124, 195, 0.18) 30%, transparent 65%),
        radial-gradient(circle at 80% 18%, rgba(145, 201, 238, 0.2) 0%, transparent 45%),
        linear-gradient(180deg, #1b1830 0%, var(--midnight) 58%, #101c18 100%);
      --accent-glow: rgba(145, 201, 238, 0.35);
      --border-metallic: var(--silver);
    }

    [data-court="autumn"] {
      --bg-primary: #14090E;
      --bg-elevated: rgba(42, 16, 29, 0.9);
      --bg-scene:
        radial-gradient(circle at 50% 12%, rgba(194, 123, 160, 0.28) 0%, transparent 60%),
        linear-gradient(180deg, #2b1024 0%, var(--wine) 55%, var(--burgundy) 100%);
      --accent-glow: rgba(198, 203, 213, 0.25);
      --border-metallic: #A8AEB9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      background-image: var(--bg-scene);
      color: var(--snow);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.6s ease;
    }

    .particles-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--pure-white), var(--sky-blue));
      opacity: 0.55;
      animation: floatDrift linear infinite;
    }

    @keyframes floatDrift {
      0% { transform: translateY(105vh) translateX(0); opacity: 0; }
      20% { opacity: 0.65; }
      80% { opacity: 0.45; }
      100% { transform: translateY(-10vh) translateX(25px); opacity: 0; }
    }

    /* =====================================================================
       WHIMSICAL SUNSET GATE LANDING PAGE
       ===================================================================== */
    #entrance-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #141224;
      overflow: hidden;
      transition: opacity 0.95s ease 0.95s, visibility 0.95s ease 0.95s;
    }

    #entrance-overlay.gates-open {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .estate-scene-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .estate-backdrop-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Parting Left & Right Glowing Silver-Iron Gates */
    .iron-gate-wing {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 2;
      pointer-events: none;
      transition: transform 1.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .iron-gate-wing.left { left: 0; }
    .iron-gate-wing.right { right: 0; }

    #entrance-overlay.gates-open .iron-gate-wing.left {
      transform: translateX(-100%);
    }

    #entrance-overlay.gates-open .iron-gate-wing.right {
      transform: translateX(100%);
    }

    .iron-gate-wing svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top Title Crest Floating in the Sunset Sky */
    .sky-crest {
      position: absolute;
      top: 4.5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      text-align: center;
      pointer-events: none;
      width: 90%;
      transition: opacity 0.5s ease;
    }

    #entrance-overlay.gates-open .sky-crest { opacity: 0; }

    .sky-crest-sigil {
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 4px;
      color: var(--lantern-warm);
      text-shadow: 0 0 12px rgba(255, 246, 224, 0.9);
    }

    .sky-crest-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.5rem, 3.6vw, 2.4rem);
      color: var(--pure-white);
      text-shadow: 0 2px 18px rgba(17, 18, 26, 0.85), 0 0 26px var(--sky-blue);
      letter-spacing: 2.5px;
      margin-top: 0.2rem;
    }

    .sky-crest-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(0.95rem, 1.8vw, 1.18rem);
      color: var(--moonlight);
      text-shadow: 0 2px 10px rgba(17, 18, 26, 0.95);
    }

    /* =====================================================================
       LEFT-PILLAR BUZZER BUTTON WITH RUNNING FAIRY-GLOW GLITTER
       ===================================================================== */
    .buzzer-mount {
      position: absolute;
      left: 28.8%;
      top: 63.5%;
      transform: translate(-50%, -50%);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #entrance-overlay.gates-open .buzzer-mount {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.9);
    }

    .buzzer-plate {
      position: relative;
      padding: 3px;
      border-radius: 999px;
      overflow: hidden;
      box-shadow:
        0 0 22px rgba(145, 201, 238, 0.7),
        0 0 38px rgba(255, 246, 224, 0.55);
      animation: fairyPulse 2.6s ease-in-out infinite;
    }

    /* Running Fairy-Glow Glitter Ring */
    .buzzer-plate::before {
      content: "";
      position: absolute;
      inset: -120%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        #ffffff 40deg,
        #91C9EE 85deg,
        #FFF6E0 130deg,
        transparent 180deg,
        #E5EAF4 240deg,
        #ffffff 290deg,
        transparent 360deg
      );
      animation: fairySpin 2.4s linear infinite;
    }

    @keyframes fairySpin {
      to { transform: rotate(360deg); }
    }

    @keyframes fairyPulse {
      0%, 100% {
        box-shadow: 0 0 18px rgba(145, 201, 238, 0.65), 0 0 32px rgba(255, 246, 224, 0.45);
      }
      50% {
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.95), 0 0 48px rgba(145, 201, 238, 0.85);
      }
    }

    .fairy-buzz-btn {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.72rem 1.35rem;
      border: none;
      border-radius: 999px;
      background: rgba(17, 18, 26, 0.62);
      backdrop-filter: blur(8px);
      color: var(--pure-white);
      font-family: 'Cinzel', serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 10px #ffffff, 0 0 18px var(--sky-blue);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.25s ease, transform 0.2s ease;
    }

    .fairy-buzz-btn:hover {
      background: rgba(84, 40, 168, 0.65);
      transform: scale(1.04);
    }

    .sparkle-dot {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px #ffffff, 0 0 14px var(--sky-blue);
      pointer-events: none;
      animation: twinkleSpark 1.8s ease-in-out infinite;
    }
    .sparkle-dot.s1 { top: -8px; left: 14%; animation-delay: 0s; }
    .sparkle-dot.s2 { bottom: -8px; right: 18%; animation-delay: 0.6s; }
    .sparkle-dot.s3 { top: 50%; right: -10px; animation-delay: 1.1s; }
    .sparkle-dot.s4 { top: 20%; left: -10px; animation-delay: 1.4s; }

    @keyframes twinkleSpark {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.35); }
    }

    .buzzer-hint {
      margin-top: 0.45rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.88rem;
      color: var(--lantern-warm);
      background: rgba(17, 18, 26, 0.72);
      padding: 0.18rem 0.65rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 246, 224, 0.35);
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .buzzer-mount {
        left: 22%;
        top: 66%;
      }
      .fairy-buzz-btn {
        padding: 0.62rem 1.05rem;
        font-size: 0.75rem;
      }
    }

    /* =====================================================================
       TOP BAR & DOCKED PLAYLIST PLAYER
       ===================================================================== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 500;
      background: rgba(17, 18, 26, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(198, 203, 213, 0.35);
      padding: 0.65rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      color: var(--moonlight);
    }

    .moonstone-orb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
